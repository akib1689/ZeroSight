services:
  employees-db:
    # Official MySQL 8.4 LTS, digest-pinned. On first start (empty volume)
    # the entrypoint pipes data/init/01-employees.sql (generated by
    # scripts/download_datasets.py from datacharmer/test_db v1.0.7) into the
    # mysql client — same pattern as the postgres image's initdb.d.
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    container_name: eag-employees-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%" # root reachable from the host (DBeaver, etc.)
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - employees-db-data:/var/lib/mysql
      - ./data/init/01-employees.sql:/docker-entrypoint-initdb.d/01-employees.sql:ro
      - ./data/test_db:/test_db:ro # dataset's own test suite, for on-demand verification
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  employees-api:
    # FastAPI REST layer over the employees DB (api/). Digest-pinned base;
    # connects to employees-db inside the compose network (root@'%').
    build: .
    container_name: eag-employees-api
    environment:
      EMPLOYEES_DB_HOST: employees-db
      EMPLOYEES_DB_PORT: "3306"
      EMPLOYEES_DB_USER: root
      EMPLOYEES_DB_PASSWORD: root
      EMPLOYEES_DB_DATABASE: employees
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      employees-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  employees-db-data:
