[project]
name = "zerosight"
version = "0.1.0"
description = "ZeroSight: a privacy-preserving harness for LLM agents over protected data - value-free tool observations with local placeholder resolution."
license = "Apache-2.0"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    "langgraph>=0.2.0",
    "langgraph-prebuilt>=0.1.0",
    "langchain-core>=0.3.0",
    "langchain-litellm>=0.1.0",
    "datasets>=2.15.0",
    "rank-bm25>=0.2.2",
    "litellm>=1.82.3",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "langchain>=1.3.14",
    "httpx>=0.27.0",
    "azure-identity>=1.25.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "matplotlib>=3.8.0",
]

[dependency-groups]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pymysql[rsa]>=1.1",
]

[tool.uv]
default-groups = ["api"]

[tool.ruff]
line-length = 100
exclude = [".venv", "scripts", "data", "results"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools", "benchmarks", "metrics", "api"]
